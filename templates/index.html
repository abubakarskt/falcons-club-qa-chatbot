<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b46" />
    <title>Falcons Club Q&amp;A</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172b3a; background: #f3f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 680px); background: white; border-radius: 16px; padding: clamp(24px, 6vw, 48px); box-shadow: 0 12px 40px #102b4614; }
      h1 { margin: 0 0 8px; color: #102b46; }
      p { line-height: 1.6; }
      .intro { color: #536574; margin: 0 0 28px; }
      label { display: block; font-weight: 650; margin-bottom: 8px; }
      textarea { display: block; width: 100%; min-height: 110px; resize: vertical; border: 1px solid #c8d2da; border-radius: 8px; padding: 12px; font: inherit; }
      textarea:focus { outline: 3px solid #2e7dbb35; border-color: #2e7dbb; }
      button { margin-top: 12px; border: 0; border-radius: 8px; padding: 11px 20px; color: white; background: #1769aa; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
      #result { margin-top: 24px; padding: 16px; border-radius: 8px; background: #f3f6f8; }
      #result[hidden] { display: none; }
      #answer { white-space: pre-wrap; }
      #source { color: #536574; font-size: .92rem; border-top: 1px solid #dce3e8; padding-top: 12px; }
      #source:empty { display: none; }
      .note { color: #687986; font-size: .9rem; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Falcons Club Q&amp;A</h1>
      <p class="intro">Ask about club rules, events, or membership. Answers are based on the club information available to this assistant.</p>
      <form id="question-form">
        <label for="question">Your question</label>
        <textarea id="question" name="question" maxlength="1000" required placeholder="Example: How much is membership?"></textarea>
        <button id="submit" type="submit">Ask a question</button>
      </form>
      <section id="result" aria-live="polite" hidden>
        <h2>Answer</h2>
        <p id="answer"></p>
        <p id="source"></p>
      </section>
      <p class="note">Please verify important details with a club administrator. Do not use for medical or legal advice.</p>
    </main>
    <script>
      const form = document.querySelector("#question-form");
      const button = document.querySelector("#submit");
      const result = document.querySelector("#result");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Thinking…";
        result.hidden = false;
        document.querySelector("#answer").textContent = "";
        document.querySelector("#source").textContent = "";
        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: document.querySelector("#question").value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "The request could not be completed.");
          document.querySelector("#answer").textContent = data.answer;
          document.querySelector("#source").textContent = data.source ? `Source: ${data.source}` : "";
        } catch (error) {
          document.querySelector("#answer").textContent = error.message || "The assistant is temporarily unavailable. Please try again later.";
        } finally {
          button.disabled = false;
          button.textContent = "Ask a question";
        }
      });
    </script>
  </body>
</html>
